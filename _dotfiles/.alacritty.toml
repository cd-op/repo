[colors.primary]
background = "0x2e2e2e"
foreground = "0xe2e2e3"

[colors.normal]
black = "0x181819"
red = "0xfc5d7c"
green = "0x9ed072"
yellow = "0xe7c664"
blue = "0x76cce0"
magenta = "0xb39df3"
cyan = "0xf39660"
white = "0xe2e2e3"

[colors.bright]
black = "0x7f8490"
red = "0xfc5d7c"
green = "0x9ed072"
yellow = "0xe7c664"
blue = "0x76cce0"
magenta = "0xb39df3"
cyan = "0xf39660"
white = "0xe2e2e3"

[window]
decorations = "full"
dynamic_padding = false
dynamic_title = true
opacity = 1.0
startup_mode = "Windowed"

[window.dimensions]
columns = 80
lines = 24

[window.padding]
x = 10
y = 10


[bell]
animation = "EaseOutExpo"
color = "0xffffff"
duration = 0


[font]
size = 12

[font.normal]
family = "DejaVuSansM Nerd Font Mono"
style = "Regular"

[font.bold]
family = "DejaVuSansM Nerd Font Mono"
style = "Bold"

[font.italic]
family = "DejaVuSansM Nerd Font Mono"
style = "Oblique"

[font.offset]
x = 0
y = 0

[font.glyph_offset]
x = 0
y = 0


[mouse]
hide_when_typing = true

[[mouse.bindings]]
action = "PasteSelection"
mouse = "Middle"

[scrolling]
history = 10000
multiplier = 3

[selection]
# when set to true, selected text will be copied to the primary clipboard
save_to_clipboard = false
semantic_escape_chars = ",│`|:\"' ()[]{}<>"

[cursor]
style = "Block"
unfocused_hollow = true


[debug]
log_level = "Warn"
persistent_logging = false
print_events = false
render_timer = false
